spring:
  application:
    name: ai-project-scheduler
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:54329/scheduler}
    username: ${DB_USER:scheduler}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    enabled: true
    clean-disabled: true
    out-of-order: false
    locations:
      - classpath:db/migration/foundation
      - classpath:db/migration/identity
      - classpath:db/migration/task
      - classpath:db/migration/planning
      - classpath:db/migration/agent
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
